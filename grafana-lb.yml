apiVersion: v1
kind: Service
metadata:
  name: monitoring-grafana
  namespace: monitoring
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

spec:
  selector:
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/name: grafana

  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP

  type: LoadBalancer
